<body data-spy="scroll"data-target="safariNav" data-offset="60">

             <li data-target=#safaricarousel data-slide-t="2"></li>
        </ol>
        <div class="carousel-inner"></div>
        <div class="carousel-item active safari-slide slide-forest">Forest Safari</div>
         <div class="carousel-item  safari-slide slide-forest">Ocean Safari</div>

          </div>
